<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>京浜東北線 vs 東海道線 先着チェッカー</title>
<meta name="description" content="京浜東北線と東海道線、選んだ駅にどっちが先に着くかをリアルタイムに判定します。">
<meta name="theme-color" content="#0b1f3a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="京浜東北vs東海道">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="app-header-text">
      <h1>先着どっち？</h1>
    </div>
    <button id="openPicker" class="picker-trigger" aria-label="区間選択">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6" cy="6" r="2.6"></circle>
        <circle cx="18" cy="18" r="2.6"></circle>
        <path d="M8.2 7.6 L15.8 16.4"></path>
      </svg>
    </button>
  </header>

  <section class="station-row">
    <select id="fromSelect" class="station-select" aria-label="出発駅"></select>
    <button id="swapStations" class="swap-btn" aria-label="出発駅と到着駅を入れ替え">⇄</button>
    <select id="toSelect" class="station-select" aria-label="到着駅"></select>
  </section>

  <section class="clock-row">
    <div class="clock" id="clock">--:--:--</div>
    <div class="daytype-toggle" id="daytypeToggle">
      <button data-mode="auto" class="active">自動</button>
      <button data-mode="weekday">平日</button>
      <button data-mode="weekend">土休日</button>
    </div>
  </section>

  <section class="buffer-row">
    <label for="bufferInput">乗り換え・待ち時間の余裕（分）</label>
    <div class="buffer-input-wrap">
      <button id="bufferMinus" class="stepper">−</button>
      <input type="number" id="bufferInput" min="-15" max="15" value="2">
      <button id="bufferPlus" class="stepper">＋</button>
    </div>
  </section>

  <section id="result" class="result">
    <div class="result-banner" id="resultBanner">読み込み中…</div>
  </section>

  <section class="cards" id="cardsContainer"></section>

  <div id="stationPicker" class="station-picker hidden" role="dialog" aria-modal="true" aria-label="区間選択">
    <div class="picker-header">
      <button id="pickerBack" class="picker-nav-btn hidden" aria-label="戻る">←</button>
      <span class="picker-title">区間選択</span>
      <button id="pickerClose" class="picker-nav-btn" aria-label="閉じる">×</button>
    </div>
    <div class="picker-body">
      <div class="picker-slots">
        <div class="picker-slot" id="pickerFromSlot">
          <span class="picker-slot-label">出発</span>
          <span class="picker-slot-value" id="pickerFromValue">未選択</span>
        </div>
        <div class="picker-slot" id="pickerToSlot">
          <span class="picker-slot-label">到着</span>
          <span class="picker-slot-value" id="pickerToValue">―</span>
        </div>
      </div>
      <ul class="station-list hidden" id="stationList"></ul>
      <div class="kana-grid" id="kanaGrid"></div>
    </div>
  </div>

  <footer class="app-footer">
    <p id="datasetNote"></p>
    <p class="disclaimer">
      時刻はJR東日本公式時刻表（<a href="https://timetables.jreast.co.jp/" target="_blank" rel="noopener">timetables.jreast.co.jp</a>）および京急電鉄の時刻表（<a href="https://ekitan.com/" target="_blank" rel="noopener">駅探</a>経由）を基にした静的データです。
      実際の運行は遅延・ダイヤ改正等で変わるため、参考情報としてご利用ください。
    </p>
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
